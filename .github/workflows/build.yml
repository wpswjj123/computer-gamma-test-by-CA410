name: Build gamma_test_final.exe

# 触发方式：
#  1) 每次 push 到 main / master 自动构建
#  2) 也可以在 Actions 页面手动点 "Run workflow"
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # GUI 程序：--onefile 单文件 + --windowed 不弹黑框
      # 脚本不读取任何外部文件，因此不需要 --add-data
      # pandas.to_excel 底层依赖 openpyxl，显式 --hidden-import 防止漏收集
      - name: Build exe
        run: >
          pyinstaller --onefile --noconfirm --clean --windowed
          --name gamma_test_final
          --hidden-import openpyxl
          gamma_test_final.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gamma_test_final-windows
          path: dist/gamma_test_final.exe